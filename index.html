<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STL PinCut 3D</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                900: '#064e3b',
                950: '#022c22'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-gray-950 text-white m-0 p-0 overflow-hidden select-none">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; gap: 16px;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
        <div style="font-size: 16px; font-weight: 600; color: #34d399; letter-spacing: -0.01em;">STL PinCut 3D Yükleniyor...</div>
        <div style="font-size: 12px; color: #6b7280;">3D motoru ve bileşenler hazırlanıyor</div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
